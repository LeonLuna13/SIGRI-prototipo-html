<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGRI · Registrar sensor</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D3A8A;text-decoration:none}a:hover{color:#142A66}
</style>
</head>
<body>
<div style="min-height:100vh;padding:24px;box-sizing:border-box;background:#3A4257;display:flex;align-items:center;justify-content:center;font-family:'Manrope',system-ui,sans-serif;color:#14171F;font-size:15px;line-height:1.4">
<div role="dialog" aria-modal="true" style="width:640px;box-sizing:border-box;background:#FFFFFF;border-radius:28px;border-top:8px solid #1D3A8A;padding:32px 36px 36px;display:flex;flex-direction:column;gap:18px;box-shadow:0 24px 60px rgba(8,14,32,0.45)">
<div style="display:flex;flex-direction:column;gap:2px"><h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-0.01em">Registrar sensor</h1></div>
<div style="display:flex;gap:14px"><label style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#555B66">Código<input type="text" value="SN-010" placeholder="" style="height:52px;width:100%;box-sizing:border-box;padding:0 16px;border-radius:14px;border:2px solid #1D3A8A;box-shadow:0 0 0 4px #D5DEF7;background:#FFFFFF;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:17px;color:#14171F"></label><label style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#555B66">Tipo de sensor<select style="height:52px;width:100%;box-sizing:border-box;padding:0 14px;border-radius:14px;border:1.5px solid #C9CED8;background:#FFFFFF;font-family:'Manrope',system-ui,sans-serif;font-size:16px;color:#14171F"><option>Pluviómetro (mm/h)</option><option>Nivel de agua (m)</option><option>Caudal (m³/s)</option></select></label></div>
<div style="display:flex;gap:14px"><label style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#555B66">Latitud<input type="text" value="-34.931000" placeholder="" style="height:52px;width:100%;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1.5px solid #C9CED8;background:#FFFFFF;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:17px;color:#14171F"></label><label style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#555B66">Longitud<input type="text" value="-57.941500" placeholder="" style="height:52px;width:100%;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1.5px solid #C9CED8;background:#FFFFFF;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:17px;color:#14171F"></label></div>
<label style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#555B66">Estado operativo<select style="height:52px;width:100%;box-sizing:border-box;padding:0 14px;border-radius:14px;border:1.5px solid #C9CED8;background:#FFFFFF;font-family:'Manrope',system-ui,sans-serif;font-size:16px;color:#14171F"><option>Activo</option><option>Inactivo</option><option>En mantenimiento</option><option>Desconectado</option><option>Baja</option></select></label>
<div style="display:flex;gap:10px;align-items:flex-start;background:#F3F4F7;border-radius:12px;padding:12px 14px;color:#3F4550;font-size:14px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.6v.1"/></svg><span>Después de registrarlo podés asociarlo a una o más zonas de riesgo desde el módulo Zonas.</span></div>
<div style="display:flex;gap:14px;margin-top:6px"><a href="Sensores.html" style="flex:1 1 0;display:flex;align-items:center;justify-content:center;height:60px;border-radius:16px;font-size:17px;font-weight:800;background:#E8EAEF;color:#14171F">Cancelar</a><a href="Sensores.html" style="flex:1 1 0;display:flex;align-items:center;justify-content:center;height:60px;border-radius:16px;font-size:17px;font-weight:800;background:#1D3A8A;color:#FFFFFF">Registrar sensor</a></div>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
