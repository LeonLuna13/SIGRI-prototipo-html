<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGRI · Registrar zona de riesgo</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D3A8A;text-decoration:none}a:hover{color:#142A66}
</style>
</head>
<body>
<div style="min-height:100vh;padding:24px;box-sizing:border-box;background:#3A4257;display:flex;align-items:center;justify-content:center;font-family:'Manrope',system-ui,sans-serif;color:#14171F;font-size:15px;line-height:1.4">
<div role="dialog" aria-modal="true" style="width:640px;box-sizing:border-box;background:#FFFFFF;border-radius:28px;border-top:8px solid #1D3A8A;padding:32px 36px 36px;display:flex;flex-direction:column;gap:18px;box-shadow:0 24px 60px rgba(8,14,32,0.45)">
<div style="display:flex;flex-direction:column;gap:2px"><h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-0.01em">Registrar zona de riesgo</h1><span style="color:#555B66">La zona se dibuja en el mapa como un círculo</span></div>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#555B66">Nombre<input type="text" value="Arroyo del Gato – Tolosa" placeholder="" style="height:52px;width:100%;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1.5px solid #C9CED8;background:#FFFFFF;font-family:'Manrope',system-ui,sans-serif;font-size:17px;color:#14171F"></label>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#555B66">Descripción<input type="text" value="Cuenca baja del arroyo, anegamientos frecuentes" placeholder="" style="height:52px;width:100%;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1.5px solid #C9CED8;background:#FFFFFF;font-family:'Manrope',system-ui,sans-serif;font-size:17px;color:#14171F"></label>
<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:700;color:#555B66">Nivel de riesgo</span><div style="display:flex;gap:10px"><button type="button" aria-pressed="false" style="flex:1 1 0;height:52px;border-radius:14px;background:#FFFFFF;color:#14171F;border:1.5px solid #C9CED8;font-family:'Manrope',system-ui,sans-serif;font-size:16px;font-weight:700;cursor:pointer">Bajo</button><button type="button" aria-pressed="false" style="flex:1 1 0;height:52px;border-radius:14px;background:#FFFFFF;color:#14171F;border:1.5px solid #C9CED8;font-family:'Manrope',system-ui,sans-serif;font-size:16px;font-weight:700;cursor:pointer">Medio</button><button type="button" aria-pressed="true" style="flex:1 1 0;height:52px;border-radius:14px;background:#1D3A8A;color:#FFFFFF;border:2px solid #1D3A8A;font-family:'Manrope',system-ui,sans-serif;font-size:16px;font-weight:700;cursor:pointer">Alto</button></div></div>
<div style="display:flex;gap:14px"><label style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#555B66">Latitud del centro<input type="text" value="-34.898500" placeholder="" style="height:52px;width:100%;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1.5px solid #C9CED8;background:#FFFFFF;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:17px;color:#14171F"></label><label style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#555B66">Longitud del centro<input type="text" value="-57.977200" placeholder="" style="height:52px;width:100%;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1.5px solid #C9CED8;background:#FFFFFF;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:17px;color:#14171F"></label></div>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#555B66">Diámetro (metros)<input type="text" value="2400" placeholder="" style="height:52px;width:100%;box-sizing:border-box;padding:0 16px;border-radius:14px;border:2px solid #1D3A8A;box-shadow:0 0 0 4px #D5DEF7;background:#FFFFFF;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:17px;color:#14171F"></label>
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;background:#101B36;color:#FFFFFF;border-radius:16px;padding:16px 22px"><span style="color:#D5DCEC">Radio calculado</span><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:28px;font-weight:700">1.200 m</span></div>
<div style="display:flex;gap:14px;margin-top:6px"><a href="Zonas.html" style="flex:1 1 0;display:flex;align-items:center;justify-content:center;height:60px;border-radius:16px;font-size:17px;font-weight:800;background:#E8EAEF;color:#14171F">Cancelar</a><a href="Zonas.html" style="flex:1 1 0;display:flex;align-items:center;justify-content:center;height:60px;border-radius:16px;font-size:17px;font-weight:800;background:#1D3A8A;color:#FFFFFF">Registrar zona</a></div>
</div>
</div>
</body>
</html>
