<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGRI · Carga manual de medición</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0284C7;text-decoration:none}a:hover{color:#0369A1}
</style>
</head>
<body>
<div style="min-height:100vh;padding:24px;box-sizing:border-box;background:#2A1B12;display:flex;align-items:center;justify-content:center;font-family:'Manrope',system-ui,sans-serif;color:#2B1D14;font-size:15px;line-height:1.4">
<div role="dialog" aria-modal="true" style="width:640px;box-sizing:border-box;background:#FFFFFF;border-radius:28px;border-top:8px solid #0284C7;padding:32px 36px 36px;display:flex;flex-direction:column;gap:18px;box-shadow:0 24px 60px rgba(45,29,19,0.35)">
<div style="display:flex;flex-direction:column;gap:2px"><h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-0.01em">Carga manual de medición</h1><span style="color:#6F5E51">Simula el envío de una lectura desde un sensor</span></div>
<label style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#6F5E51">Sensor<select style="height:52px;width:100%;box-sizing:border-box;padding:0 14px;border-radius:14px;border:1.5px solid #D4C9BA;background:#FFFFFF;font-family:'Manrope',system-ui,sans-serif;font-size:16px;color:#2B1D14"><option>SN-004 · Nivel de agua · Arroyo Maldonado – Villa Elvira</option><option>SN-001 · Nivel de agua · Arroyo del Gato – Tolosa</option></select></label>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#6F5E51">Valor medido (m)<input type="text" value="2,35" inputmode="decimal" style="height:72px;width:100%;box-sizing:border-box;padding:0 20px;border-radius:16px;border:2px solid #0284C7;box-shadow:0 0 0 4px #BAE6FD;background:#FFFFFF;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:34px;font-weight:700;text-align:right;color:#2B1D14"></label>
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;background:#2D1D13;color:#FFFFFF;border-radius:16px;padding:16px 22px"><span style="color:#D8C9BC">Umbral máximo de la zona</span><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:28px;font-weight:700">2,20 m</span></div>
<div style="display:flex;gap:10px;align-items:flex-start;background:#F5F1E8;border-radius:12px;padding:12px 14px;color:#524337;font-size:14px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.6v.1"/></svg><span>Se registra con la fecha y hora actual y queda marcada como medición simulada. Se evalúa contra los umbrales igual que una lectura automática.</span></div>
<div style="display:flex;gap:14px;margin-top:6px"><a href="Mediciones.html" style="flex:1 1 0;display:flex;align-items:center;justify-content:center;height:60px;border-radius:16px;font-size:17px;font-weight:800;background:#EAE3D6;color:#2B1D14">Cancelar</a><a href="MsgInformacion.html" style="flex:1 1 0;display:flex;align-items:center;justify-content:center;height:60px;border-radius:16px;font-size:17px;font-weight:800;background:#0284C7;color:#FFFFFF">Registrar medición</a></div>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
