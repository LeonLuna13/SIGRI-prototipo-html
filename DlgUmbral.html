<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGRI · Registrar umbral</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0284C7;text-decoration:none}a:hover{color:#0369A1}
</style>
</head>
<body>
<div style="min-height:100vh;padding:24px;box-sizing:border-box;background:#2A1B12;display:flex;align-items:center;justify-content:center;font-family:'Manrope',system-ui,sans-serif;color:#2B1D14;font-size:15px;line-height:1.4">
<div role="dialog" aria-modal="true" style="width:640px;box-sizing:border-box;background:#FFFFFF;border-radius:28px;border-top:8px solid #0284C7;padding:32px 36px 36px;display:flex;flex-direction:column;gap:18px;box-shadow:0 24px 60px rgba(45,29,19,0.35)">
<div style="display:flex;flex-direction:column;gap:2px"><h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-0.01em">Registrar umbral</h1><span style="color:#6F5E51">Definí el mínimo, el máximo o ambos</span></div>
<label style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#6F5E51">Zona de riesgo<select style="height:52px;width:100%;box-sizing:border-box;padding:0 14px;border-radius:14px;border:1.5px solid #D4C9BA;background:#FFFFFF;font-family:'Manrope',system-ui,sans-serif;font-size:16px;color:#2B1D14"><option>Arroyo del Gato – Tolosa</option><option>Arroyo Maldonado – Villa Elvira</option><option>Arroyo Pérez – Los Hornos</option><option>Casco urbano – Parque Castelli</option></select></label>
<label style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#6F5E51">Tipo de sensor<select style="height:52px;width:100%;box-sizing:border-box;padding:0 14px;border-radius:14px;border:1.5px solid #D4C9BA;background:#FFFFFF;font-family:'Manrope',system-ui,sans-serif;font-size:16px;color:#2B1D14"><option>Nivel de agua (m)</option><option>Pluviómetro (mm/h)</option><option>Caudal (m³/s)</option></select></label>
<div style="display:flex;gap:14px"><label style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#6F5E51">Valor mínimo (m)<input type="text" placeholder="Sin mínimo" style="height:52px;width:100%;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1.5px solid #D4C9BA;background:#FFFFFF;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:17px;color:#2B1D14"></label><label style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#6F5E51">Valor máximo (m)<input type="text" value="2,50" placeholder="" style="height:52px;width:100%;box-sizing:border-box;padding:0 16px;border-radius:14px;border:2px solid #0284C7;box-shadow:0 0 0 4px #BAE6FD;background:#FFFFFF;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:17px;color:#2B1D14"></label></div>
<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:700;color:#6F5E51">Nivel de alerta que genera</span><div style="display:flex;gap:10px"><button type="button" aria-pressed="false" style="flex:1 1 0;height:52px;border-radius:14px;background:#FFFFFF;color:#2B1D14;border:1.5px solid #D4C9BA;font-family:'Manrope',system-ui,sans-serif;font-size:16px;font-weight:700;cursor:pointer">Bajo</button><button type="button" aria-pressed="false" style="flex:1 1 0;height:52px;border-radius:14px;background:#FFFFFF;color:#2B1D14;border:1.5px solid #D4C9BA;font-family:'Manrope',system-ui,sans-serif;font-size:16px;font-weight:700;cursor:pointer">Medio</button><button type="button" aria-pressed="true" style="flex:1 1 0;height:52px;border-radius:14px;background:#0284C7;color:#FFFFFF;border:2px solid #0284C7;font-family:'Manrope',system-ui,sans-serif;font-size:16px;font-weight:700;cursor:pointer">Alto</button></div></div>
<div style="display:flex;gap:14px;margin-top:6px"><a href="Umbrales.html" style="flex:1 1 0;display:flex;align-items:center;justify-content:center;height:60px;border-radius:16px;font-size:17px;font-weight:800;background:#EAE3D6;color:#2B1D14">Cancelar</a><a href="Umbrales.html" style="flex:1 1 0;display:flex;align-items:center;justify-content:center;height:60px;border-radius:16px;font-size:17px;font-weight:800;background:#0284C7;color:#FFFFFF">Registrar umbral</a></div>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
