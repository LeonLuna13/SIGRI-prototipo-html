00">SN-003</span><span style="flex:1 1 0;display:flex;flex-direction:column"><span style="font-weight:700">Caudal</span><span style="color:#6F5E51;font-size:13px">a 940 m del centro</span></span><span style="display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;border:1.5px solid transparent;background:#DCF2E3;color:#14532D;font-size:12px;font-weight:700;white-space:nowrap">Dentro de la zona</span></label><label style="display:flex;align-items:center;gap:14px;min-height:60px;padding:0 16px;border-radius:14px;border:1.5px solid #D4C9BA;background:#FFFFFF;cursor:pointer"><input type="checkbox" style="width:20px;height:20px;margin:0;accent-color:#0284C7"><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:15px;font-weight:700">SN-008</span><span style="flex:1 1 0;display:flex;flex-direction:column"><span style="font-weight:700">Caudal</span><span style="color:#6F5E51;font-size:13px">a 3.230 m del centro</span></span><span style="display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;border:1.5px solid transparent;background:#EAE3D6;color:#524337;font-size:12px;font-weight:700;white-space:nowrap">Fuera de la zona</span></label><label style="display:flex;align-items:center;gap:14px;min-height:60px;padding:0 16px;border-radius:14px;border:1.5px solid #D4C9BA;background:#FFFFFF;cursor:pointer"><input type="checkbox" style="width:20px;height:20px;margin:0;accent-color:#0284C7"><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:15px;font-weight:700">SN-007</span><span style="flex:1 1 0;display:flex;flex-direction:column"><span style="font-weight:700">Pluviómetro</span><span style="color:#6F5E51;font-size:13px">a 3.290 m del centro</span></span><span style="display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;border:1.5px solid transparent;background:#EAE3D6;color:#524337;font-size:12px;font-weight:700;white-space:nowrap">Fuera de la zona</span></label></div>
